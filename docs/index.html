<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اليومية</title>
<meta name="theme-color" content="#1d5bb8">
<meta name="description" content="يومية المحلات: الكاشير بيسجل الحركات وهشام بيتابعها.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one phone-first ledger column, sticky top bar, bottom tabs for the owner, sheets for data entry */
:root{
  --bg:#eef2f6; --surface:#ffffff; --sunk:#f5f7fa; --ink:#132030; --muted:#5a6878; --line:#d8dfe7;
  --accent:#1d5bb8; --accent-ink:#ffffff; --soft:#e2ebf8;
  --in:#11804a; --in-soft:#e1f2e8; --out:#c23a2c; --out-soft:#fbe6e2; --credit:#946400; --credit-soft:#f9efd5;
  --scrim:rgba(12,20,30,.45);
  --shadow:0 1px 2px rgba(19,32,48,.06),0 6px 18px rgba(19,32,48,.07);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1319; --surface:#161f29; --sunk:#111922; --ink:#e6ecf2; --muted:#93a1af; --line:#263340;
  --accent:#6ea0f5; --accent-ink:#0a1220; --soft:#1a2a40;
  --in:#4cc38a; --in-soft:#13291f; --out:#ff7b6c; --out-soft:#331a18; --credit:#e3b24f; --credit-soft:#2e2412;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0d1319; --surface:#161f29; --sunk:#111922; --ink:#e6ecf2; --muted:#93a1af; --line:#263340;
  --accent:#6ea0f5; --accent-ink:#0a1220; --soft:#1a2a40;
  --in:#4cc38a; --in-soft:#13291f; --out:#ff7b6c; --out-soft:#331a18; --credit:#e3b24f; --credit-soft:#2e2412;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.1rem;font-weight:600}
h3{font-size:.85rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.amt,.sum td{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:.8rem}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}

.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.admin{padding-bottom:110px}
section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--out);border-color:var(--out);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.wide{width:100%;padding-block:13px;font-size:1rem}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:start}

.seg{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:11px;padding:4px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.banner{border-radius:var(--r);padding:12px 14px;font-size:.92rem;border:1px solid var(--line);background:var(--surface)}
.banner.warn{background:var(--credit-soft);border-color:transparent;color:var(--ink)}
.banner.alert{background:var(--out-soft);border-color:transparent}
.banner.demo{background:var(--soft);border-color:transparent}

.tgroup{display:flex;flex-direction:column;gap:8px}
.lbl{color:var(--muted);display:flex;align-items:center;gap:6px;font-family:var(--f-body)}
.lbl::before{content:"";width:8px;height:8px;border-radius:50%}
.lbl.in::before{background:var(--in)} .lbl.out::before{background:var(--out)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:74px}
.tbtn b{font-family:var(--f-display);font-weight:600;font-size:.98rem}
.tbtn small{color:var(--muted);font-size:.78rem;line-height:1.4}
.tbtn.add{border-inline-start:4px solid var(--in)}
.tbtn.out{border-inline-start:4px solid var(--out)}
.tbtn.credit{border-inline-start:4px solid var(--credit)}
.tbtn.none{border-inline-start:4px solid var(--accent)}
.tbtn:hover:not(:disabled){border-color:var(--accent)}
.tbtn:disabled{opacity:.45;cursor:not-allowed}

.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.row.is-del .rmain,.row.is-del .amt{opacity:.55}
.row.is-del .amt{text-decoration:line-through}
.chk{padding-top:3px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rnote{font-size:.9rem}
.rmeta{font-size:.8rem;color:var(--muted)}
.rside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.amt{font-family:var(--f-display);font-weight:600;white-space:nowrap;direction:ltr}
.amt.in{color:var(--in)} .amt.out{color:var(--out)} .amt.credit{color:var(--credit)}
.cur{font-size:.75em;font-weight:500;opacity:.8}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.in{background:var(--in-soft);color:var(--in)} .pill.out{background:var(--out-soft);color:var(--out)}
.pill.credit{background:var(--credit-soft);color:var(--credit)} .pill.none{background:var(--soft);color:var(--accent)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.tag.del{border-color:var(--out);color:var(--out)} .tag.ok{border-color:var(--in);color:var(--in)} .tag.warn{border-color:var(--credit);color:var(--credit)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted);margin:0}
.dayhead{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.sum{width:100%;border-collapse:collapse;font-size:.9rem}
.sum th{font-weight:500;color:var(--muted);text-align:start;padding:6px 0;font-size:.8rem}
.sum td{padding:6px 0;border-top:1px solid var(--line)}
.sum td:not(:first-child),.sum th:not(:first-child){text-align:end}
.sum tr.total td{font-weight:700;border-top:2px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:.75rem}
.kpi .amt{font-size:1rem}

.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.field{display:flex;flex-direction:column;gap:6px;border:0;margin:0;padding:0;min-width:0}
.field label,.field legend,.flabel{font-size:.85rem;font-weight:600;color:var(--muted);padding:0}
input[type=text],input[type=search],input[type=tel],input[type=date],input:not([type]),input[type=password],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
input.big{font-family:var(--f-display);font-size:1.6rem;font-weight:600;padding:10px 14px;direction:ltr;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input,.opt input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem;background:var(--sunk)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span,.opt input:focus-visible~span{outline:2px solid var(--accent);outline-offset:2px}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;background:var(--sunk)}
.plist p{margin:0;padding:10px 12px}
.opt{position:relative;display:flex;align-items:baseline;gap:8px;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.opt:first-child{border-top:0}
.opt small{color:var(--muted);margin-inline-start:auto;direction:ltr}
.opt:has(input:checked){background:var(--soft)}
.opt:has(input:checked) span{font-weight:700;color:var(--accent)}
.opt.new span{color:var(--accent);font-weight:600}
.np{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:var(--out);font-size:.88rem;margin:0;min-height:1.2em}
.ctx{margin:0;font-size:.9rem;color:var(--muted)} .ctx b{color:var(--ink)}

.overlay{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet form{display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:1.2rem;line-height:1;flex-shrink:0}
.sheet .row{padding-inline:0}
.stmt{max-height:none}
.stmt .row{padding:10px 0}

.nav{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:10px 2px 9px;font-size:.8rem;font-weight:600;color:var(--muted);position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent)}
.badge{position:absolute;top:4px;inset-inline-start:calc(50% + 6px);background:var(--out);color:#fff;border-radius:999px;font-size:.68rem;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.actbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:4}
.actbar .grow{flex:1 1 180px}

.prow{width:100%;border:0;background:none;text-align:start;display:flex;align-items:center;gap:10px;padding:12px 14px}
.prow:hover{background:var(--sunk)}
.pn{flex:1;min-width:0;display:flex;flex-direction:column}
.pn b{font-weight:600}
.pn small{color:var(--muted);font-size:.8rem}
.note{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px}
.note:first-child{border-top:0}
.note.unread{background:var(--soft)}
.note .dot{width:8px;height:8px;border-radius:50%;margin-top:9px;flex-shrink:0;background:var(--line)}
.note.unread .dot{background:var(--accent)}
.urow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.urow:first-child{border-top:0}
.urow .pn{flex:1 1 140px}

.login{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login h1{font-size:1.6rem}
.ugrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ubtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:2px}
.ubtn b{font-family:var(--f-display);font-size:1.1rem}
.ubtn small{color:var(--muted)}
.ubtn:hover{border-color:var(--accent)}
.dots{display:flex;gap:14px;justify-content:center;direction:ltr}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots span.f{background:var(--accent);border-color:var(--accent)}
.dots.bad span{border-color:var(--out)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 0;font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.pad button:active{background:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}.sheet{animation:up .18s ease-out}}
@keyframes up{from{transform:translate(var(--tx,0),12px);opacity:.4}}
.toast{--tx:-50%}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr 1fr}.kpi{padding:6px 8px}.kpi .amt{font-size:.9rem}.np{grid-template-columns:1fr}}

.offline{background:var(--credit-soft);color:var(--ink);text-align:center;font-size:.85rem;padding:6px 16px}
input[type=password]{direction:ltr;text-align:right;letter-spacing:.3em}

</style>
</head>
<body>
<div id="app"></div>
<noscript>البرنامج محتاج JavaScript يشتغل.</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
