<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>H-Cash</title>
<meta name="theme-color" content="#102a35">
<script>try{var t=localStorage.getItem('yawmeya-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<meta name="description" content="يومية المحلات: الكاشير بيسجل أخدت وأعطيت، وهشام بينقلها لكناش.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png?v=34" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png?v=34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://srpgxvdbpkinrvklwywx.supabase.co">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Navy shop-ledger band on top, white cards below; green = أخدت, red = أعطيت (Konnash's own colors) */
:root{
  --brand:#14325e; --brand-2:#1f4f8f; --brand-ink:#ffffff; --brand-muted:rgba(255,255,255,.75);
  --bg:#f1f3f7; --surface:#ffffff; --sunk:#f4f6f9; --ink:#141a24; --muted:#5b6574; --line:#e1e5eb;
  --accent:#2457b3; --accent-ink:#ffffff; --strong:#14325e;
  --took:#0b8a4a; --took-soft:#e3f5eb; --gave:#d33a2f; --gave-soft:#fde8e6;
  --acc:#7a3fc4; --acc-soft:#f1e9fb; --hc:#a35f00; --hc-soft:#fdf0dc; --cs:#2457b3; --cs-soft:#e6eefb;
  --shadow:0 1px 2px rgba(18,24,34,.06),0 8px 24px rgba(18,24,34,.08);
  --scrim:rgba(10,16,26,.55);
  --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  --num:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#122640; --brand-2:#1c3d68; --brand-muted:rgba(255,255,255,.7);
  --bg:#0e1218; --surface:#171d27; --sunk:#121821; --ink:#eef2f7; --muted:#a1abb9; --line:#27303c;
  --accent:#3f7be0; --accent-ink:#ffffff; --strong:#3f7be0;
  --took:#3cc683; --took-soft:#11291c; --gave:#ff7b70; --gave-soft:#331716;
  --acc:#b98cf2; --acc-soft:#251a35; --hc:#f0b450; --hc-soft:#2e2311; --cs:#7aa6f0; --cs-soft:#152238;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --brand:#122640; --brand-2:#1c3d68; --brand-muted:rgba(255,255,255,.7);
  --bg:#0e1218; --surface:#171d27; --sunk:#121821; --ink:#eef2f7; --muted:#a1abb9; --line:#27303c;
  --accent:#3f7be0; --accent-ink:#ffffff; --strong:#3f7be0;
  --took:#3cc683; --took-soft:#11291c; --gave:#ff7b70; --gave-soft:#331716;
  --acc:#b98cf2; --acc-soft:#251a35; --hc:#f0b450; --hc-soft:#2e2311; --cs:#7aa6f0; --cs-soft:#152238;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.65); color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.35;font-weight:700}
h1{font-size:1.45rem} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:.88rem}
.took-t{color:var(--took)} .gave-t{color:var(--gave)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top band */
.band{background:linear-gradient(160deg,var(--brand-2),var(--brand) 70%);color:var(--brand-ink);padding-top:env(safe-area-inset-top,0px)}
.band .in{max-width:680px;margin:0 auto;padding-block:14px 20px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;gap:10px}
.bar .who{flex:1;min-width:0}
.bar .who b{display:block;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .who small{color:var(--brand-muted)}
.ibtn{border:0;background:rgba(255,255,255,.14);color:var(--brand-ink);border-radius:12px;min-height:40px;padding:0 12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.ibtn svg{width:20px;height:20px}
.shops{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.shops button{border:1px solid rgba(255,255,255,.28);background:transparent;color:var(--brand-ink);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.shops button.on{background:var(--brand-ink);color:var(--brand);border-color:var(--brand-ink)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px;min-width:0}
.sum small{display:block;color:var(--brand-muted);font-size:.85rem}
.sum b{font-size:1.45rem;font-weight:600}
.sum .in-t{color:#8ff0bd} .sum .out-t{color:#ffb3ab}
.offline{background:var(--gave);color:#fff;text-align:center;font-size:.9rem;padding:6px 16px}
.demo{background:#f5c542;color:#3a2a00;text-align:center;font-size:.85rem;font-weight:600;padding:4px 16px}

.band.tall .in{padding-bottom:56px}
.wrap{max-width:680px;margin:18px auto 0;display:flex;flex-direction:column;gap:18px;padding-bottom:40px;position:relative}
.wrap.lift{margin-top:-40px}
.wrap.admin{padding-bottom:40px}
/* owner screen: header + content scroll above a bar that is part of the layout, so it can never slide under the phone's buttons */
.shell{height:100vh;height:100dvh;height:var(--app-h,100dvh);display:flex;flex-direction:column;overflow:hidden}
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.shops.light button{border-color:var(--line);color:var(--ink);background:var(--surface)}
.shops.light button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day{gap:8px}
.dayrow{width:100%;border:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:start;color:var(--ink)}
.dname{flex:1;min-width:0;display:flex;flex-direction:column}
.dname small{color:var(--muted);font-size:.84rem}
.dtot{display:flex;flex-direction:column;align-items:flex-end;font-weight:600;font-size:.98rem}
.chev{font-size:1.4rem;color:var(--muted);transition:transform .25s;transform:rotate(0deg)}
.day.open .chev{transform:rotate(-90deg)}
section{display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* two main actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.act{border:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:1.35rem;font-weight:700;color:var(--ink);transition:transform .08s}
.act:active{transform:scale(.97)}
.act .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff}
.act .ic svg{width:28px;height:28px}
.act.took .ic{background:var(--took)} .act.gave .ic{background:var(--gave)}
.act.took{color:var(--took)} .act.gave{color:var(--gave)}
.act:disabled{opacity:.45;cursor:not-allowed}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--gave);border-color:var(--gave);color:#fff}
.btn.took{background:var(--took);border-color:var(--took);color:#fff}
.btn.gave{background:var(--gave);border-color:var(--gave);color:#fff}
.btn.wide{width:100%;min-height:56px;font-size:1.08rem;border-radius:16px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px;min-height:0;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* entries */
.list{list-style:none;margin:0;padding:4px 0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative}
.item+.item::before{content:"";position:absolute;top:0;inset-inline:66px 14px;border-top:1px solid var(--line)}
.item.tap{cursor:pointer} .item.tap:active{background:var(--sunk)}
.av{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:1.05rem;color:#fff}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{display:block;color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.mid .flag{color:var(--gave)}
.mid .note{color:var(--ink);opacity:.75}
.lockhero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.lockhero p{color:var(--muted);font-size:.92rem;max-width:34ch}
.lockic{width:64px;height:64px;border-radius:50%;background:var(--strong);color:var(--brand-ink);display:grid;place-items:center;flex-shrink:0}
.lockic svg{width:30px;height:30px}
.lockic.sm{width:42px;height:42px} .lockic.sm svg{width:20px;height:20px}
.kpis3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis3 div{background:var(--sunk);border-radius:14px;padding:10px;text-align:center;min-width:0}
.kpis3 small{display:block;color:var(--muted);font-size:.8rem}
.kpis3 b{font-size:1.15rem}
.pinlbl{text-align:center;font-weight:600}
.btn.dark{background:var(--strong);border-color:var(--strong);color:#fff}
.cashline{font-weight:700;font-size:1.25rem;margin:2px 0}
.cashline .num{font-family:var(--num)}
.cashline small{display:inline;font-size:.8rem;font-weight:500;color:var(--muted)}
.cash{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.cash small{color:var(--brand-muted);font-size:.9rem}
.cash b{font-family:var(--num);font-size:2.3rem;font-weight:700;line-height:1.1}
.cash b.none{font-family:var(--font);font-size:1rem;font-weight:600;color:#ffd38a}
.lockic.off{background:var(--sunk);color:var(--muted)}
.dtot .num:first-child:not(.took-t){font-weight:700}
.drawers{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:8px;margin:2px 0 6px}
.drawers span{background:rgba(255,255,255,.1);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center}
.drawers small{color:var(--brand-muted);font-size:.8rem}
.drawers b{font-size:1.15rem;font-weight:700}
.acts .act.sell{grid-column:1/-1;min-height:72px;flex-direction:row;gap:12px;color:var(--cs)}
.act.sell .ic{background:var(--cs);width:44px;height:44px} .act.sell .ic svg{width:24px;height:24px}
.sheet .sh.sell{background:#2457b3;color:#fff}
.ic-s svg{width:22px;height:22px;vertical-align:-4px}
.devav{background:var(--cs-soft);color:var(--cs)} .devav svg{width:22px;height:22px}
.tag.pay-cashier{background:var(--cs-soft);color:var(--cs)} .tag.pay-acc{background:var(--acc-soft);color:var(--acc)} .tag.pay-hcash{background:var(--hc-soft);color:var(--hc)}
.stock{display:flex;flex-direction:column;align-items:center;min-width:48px;border-radius:12px;background:var(--took-soft);color:var(--took);padding:4px 8px;line-height:1.2}
.stock b{font-size:1.2rem} .stock small{font-size:.72rem;font-weight:600}
.stock.out{background:var(--gave-soft);color:var(--gave)}
.devpick{box-shadow:none;border:1px solid var(--line)}
.item.sale .mid b{white-space:normal}
.mini3{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px;margin:6px 0}
.mini3 span{background:var(--sunk);border-radius:12px;padding:6px 4px;text-align:center;min-width:0}
.mini3 small{display:block;font-size:.75rem;color:var(--muted)}
.mini3 i{font-style:normal;font-weight:700;font-size:1.05rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini3 i.gave-t{font-family:var(--font);font-size:.85rem}
.odbtns{display:flex;gap:8px;margin-top:8px}
.odbtns .btn{flex:1}
.devpick .empty{box-shadow:none}
.sb .back{color:var(--accent)}
.qty{display:flex;align-items:center;justify-content:center;gap:14px}
.qty span{color:var(--muted);font-weight:600}
.qty button{width:48px;height:48px;border-radius:50%;border:0;background:var(--sunk);font-size:1.5rem;font-weight:700;color:var(--ink)}
.qty button:disabled{opacity:.35}
.qty b{font-size:1.6rem;min-width:2ch;text-align:center}
.saletot{text-align:center;background:var(--sunk);border-radius:14px;padding:10px}
.paygrid{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.paygrid button{border:2px solid var(--line);background:var(--surface);border-radius:14px;min-height:60px;font-weight:700;font-size:.95rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;padding:6px 4px}
.paygrid button small{font-weight:500;font-size:.75rem;color:var(--muted)}
.paygrid .p-cashier.on{border-color:var(--cs);background:var(--cs-soft);color:var(--cs)}
.paygrid .p-acc.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.paygrid .p-hcash.on{border-color:var(--hc);background:var(--hc-soft);color:var(--hc)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;min-height:44px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.daysales{font-size:.88rem;color:var(--muted);padding:2px 6px 8px;line-height:1.8}
.daysales b{color:var(--ink)}
.dayinfo{color:var(--brand-muted);font-size:.85rem}
.card.flat{box-shadow:none;padding:12px}
.took-bg{background:var(--took-soft)} .gave-bg{background:var(--gave-soft)}
b.big{font-size:1.4rem}
.dots.dark span{border-color:var(--muted)}
.dots.dark span.f{background:var(--ink);border-color:var(--ink)}
.dots.dark.bad span{border-color:var(--gave)}
.live{color:var(--took);font-weight:600}
.sum .pair{display:flex;justify-content:space-between;gap:8px}
.sum .pair span{min-width:0}
.sum .pair b{font-size:1.1rem}
.end{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.amt{font-family:var(--num);font-weight:600;font-size:1.08rem;white-space:nowrap}
.amt .cur{font-family:var(--font);font-size:.75em;font-weight:500;opacity:.75}
.item.del .mid b,.item.del .amt{text-decoration:line-through;opacity:.5}
.item.pending{opacity:.6}
.tag{font-size:.78rem;font-weight:600;border-radius:6px;padding:0 6px}
.tag.took{background:var(--took-soft);color:var(--took)} .tag.gave{background:var(--gave-soft);color:var(--gave)}
.empty{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:28px 20px;text-align:center;color:var(--muted)}
.dayhead{font-size:.88rem;color:var(--muted);font-weight:600;padding-inline:4px}
.banner{border-radius:16px;padding:12px 14px;background:var(--gave-soft);color:var(--ink)}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.92rem;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--sunk);border-radius:14px;padding:12px 14px;min-width:0;min-height:50px}
input:focus,select:focus{border-color:var(--accent);outline:0;background:var(--surface)}
input.amount{font-family:var(--num);font-size:2.2rem;font-weight:600;text-align:center;direction:ltr;min-height:70px}
input[type=password]{direction:ltr;text-align:center;letter-spacing:.4em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names{display:flex;flex-wrap:wrap;gap:8px}
.names p{color:var(--muted);font-size:.9rem}
.pick{position:relative}
.pick input{position:absolute;opacity:0;pointer-events:none;width:1px;min-height:0}
.pick > span{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}
.pick > input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick.new > span{border-style:dashed;color:var(--accent)}
.err{color:var(--gave);font-size:.92rem;min-height:1.3em}

/* sheet */
.overlay{position:fixed;inset:var(--vv-top,0px) 0 auto 0;height:100vh;height:var(--app-h,100dvh);background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:24px 24px 0 0;display:flex;flex-direction:column}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px))}
.sheet .sh.took{background:var(--took);color:#fff} .sheet .sh.gave{background:var(--gave);color:#fff}
.sheet .sh h2{font-size:1.3rem}
.sheet .sb{display:flex;flex-direction:column;gap:14px;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet form{display:contents}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:24px}}
.x{border:0;background:rgba(127,127,127,.18);color:inherit;width:40px;height:40px;border-radius:50%;font-size:1.3rem;line-height:1;flex-shrink:0}

.kstep{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:6px 0 4px}
.kstep .av{width:64px;height:64px;font-size:1.6rem}
.kstep .name{font-size:1.5rem;font-weight:700;overflow-wrap:anywhere}
.kstep .press b{display:inline-block;color:#fff;border-radius:10px;padding:3px 16px;margin:0 4px;font-size:1.05rem}
.kstep .press b.took{background:var(--took)} .kstep .press b.gave{background:var(--gave)}
.kstep .bignum{font-family:var(--num);font-size:3.6rem;font-weight:700;line-height:1.05}
.kstep .note{background:var(--sunk);border-radius:10px;padding:6px 12px}
.steps{display:flex;justify-content:center;gap:6px;color:var(--muted);font-size:.85rem}

.nav{position:relative;flex-shrink:0;z-index:20;background:var(--surface);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px);touch-action:manipulation}
/* while typing, the keyboard would push the bar up over the field: hide it until typing is done */
body.typing .nav,body.kb .nav{display:none}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:0;background:none;padding:10px 2px;font-size:.82rem;font-weight:600;color:var(--muted);position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}
.badge{position:absolute;top:6px;inset-inline-start:calc(50% + 8px);background:var(--gave);color:#fff;border-radius:999px;font-size:.72rem;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-family:var(--num)}

/* amount pad */

/* drawer settings */
.dshop{border:1px solid var(--line);border-radius:14px;padding:6px 12px 12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}

.switch{display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:6px;cursor:pointer;position:relative}

.switch span::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch input:checked+span{background:var(--took)}

/* theme picker */
.thbtn{padding:0 10px}

.prev i{height:34%;display:block}

.p-light{background:#f1f3f7} .p-light i{background:linear-gradient(160deg,#1f4f8f,#14325e)} .p-light b{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* sliding pill behind the current tab */
.nav .in{position:relative}
.navpill{position:absolute;top:7px;right:0;width:20%;height:32px;display:flex;justify-content:center;pointer-events:none;transform:translateX(calc(var(--to) * -100%))}

::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

/* ---------- motion: short, smooth, no bounce on content ---------- */
.act,.btn,.kp button,.pad button,.ubtn,.pick > span,.dayrow{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);pointer-events:none;animation:ripple .5s ease-out forwards}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.confetti i{position:absolute;left:50%;bottom:20%;width:9px;height:14px;border-radius:2px;animation:confetti 1.5s cubic-bezier(.2,.7,.3,1) forwards}
@media (prefers-reduced-motion:no-preference){
  .band.enter .in > *{animation:fadeIn .3s ease-out both}
  .wrap.enter > *{animation:fadeUp .32s cubic-bezier(.2,.8,.2,1) both}
  .wrap.enter > *:nth-child(2){animation-delay:.04s} .wrap.enter > *:nth-child(3){animation-delay:.08s} .wrap.enter > *:nth-child(n+4){animation-delay:.12s}
  .wrap.enter .act{animation:scaleIn .35s cubic-bezier(.2,.8,.2,1) both}
  .wrap.enter .act:nth-child(2){animation-delay:.06s}
  .login .in.enter > *{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both}
  .login .in.enter > *:nth-child(2){animation-delay:.04s} .login .in.enter > *:nth-child(n+3){animation-delay:.08s}
  .item.rise{animation:fadeUp .3s cubic-bezier(.2,.8,.2,1) both}
  .item.pop{animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both}
  .overlay{animation:fadeIn .18s ease-out both}
  .overlay .sheet{animation:sheetUp .3s cubic-bezier(.2,.8,.2,1) both}
  .overlay.still,.overlay.still .sheet{animation:none}
  .pick input:checked+span{animation:tap .2s ease-out}
  .amtbox.bump{animation:tap .15s ease-out}
  .kp button,.pad button,.act,.btn,.dayrow{transition:transform .1s ease-out, background .15s}
  .kp button:active,.pad button:active{transform:scale(.94)}
  .act:active,.btn:active,.dayrow:active{transform:scale(.98)}
  .kstep.swap{animation:slideIn .3s cubic-bezier(.2,.8,.2,1) both}
  .dots span.pop{animation:tap .2s ease-out}
  .dots.shake{animation:shake .4s}
  .toast{animation:toastIn .28s cubic-bezier(.2,.8,.2,1) both}
  .day.open .list{animation:fadeUp .25s ease-out both}
  /* tabs slide in from the side you came from */
  .wrap.enter.tab-next > *{animation:fromLeft .34s cubic-bezier(.2,.8,.2,1) both}
  .wrap.enter.tab-prev > *{animation:fromRight .34s cubic-bezier(.2,.8,.2,1) both}
  .navpill.move{animation:pillMove .42s cubic-bezier(.3,1.25,.5,1) both}
  /* sheets: soft spring up, slide down when closing */
  .overlay .sheet{animation:sheetUp .38s cubic-bezier(.2,1.05,.3,1) both}
  .overlay.out{animation:fadeOut .22s ease-in forwards;pointer-events:none}
  .overlay.out .sheet{animation:sheetDown .22s ease-in forwards}
  /* balances glow when they change */
  .flash-up{animation:flashUp .9s ease-out}
  .flash-down{animation:flashDown .9s ease-out}
  /* a new row lights up for a moment */
  .item.pop{animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both, rowFlash 1.6s ease-out}
  /* login */
  .login .logo i{animation:logoIn .7s cubic-bezier(.3,1.4,.5,1) both}
  .login .in.enter .ubtn{animation:scaleIn .4s cubic-bezier(.2,.8,.2,1) both}
  .ugrid .ubtn:nth-child(2){animation-delay:.05s} .ugrid .ubtn:nth-child(3){animation-delay:.1s} .ugrid .ubtn:nth-child(n+4){animation-delay:.15s}
  .paygrid button.on,.seg button.on,.th.on{animation:tap .22s ease-out}
  .act .ic{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
  .act:active .ic{transform:scale(.86) rotate(-8deg)}
  .thbtn svg{transition:transform .4s cubic-bezier(.3,1.5,.5,1)} .thbtn:active svg{transform:rotate(40deg) scale(.9)}
  .th:active{transform:scale(.96)}
  .stock.out{animation:softPulse 2.4s ease-in-out infinite}
}
@keyframes fromLeft{from{transform:translateX(-28px);opacity:0}}
@keyframes fromRight{from{transform:translateX(28px);opacity:0}}
@keyframes pillMove{from{transform:translateX(calc(var(--from) * -100%))}}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetDown{to{transform:translateY(60px);opacity:0}}
@keyframes flashUp{25%{transform:scale(1.07);text-shadow:0 0 22px rgba(60,198,131,.85)}}
@keyframes flashDown{25%{transform:scale(1.07);text-shadow:0 0 22px rgba(255,123,112,.85)}}
@keyframes rowFlash{0%,30%{background:color-mix(in srgb, var(--accent) 14%, transparent)}}
@keyframes logoIn{from{transform:scale(.4) rotate(-20deg);opacity:0}}
@keyframes softPulse{50%{opacity:.6}}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes confetti{0%{transform:translate(-50%,0) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--x)),var(--y)) rotate(var(--r));opacity:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeUp{from{transform:translateY(10px);opacity:0}}
@keyframes scaleIn{from{transform:scale(.94);opacity:0}}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
@keyframes tap{50%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes toastIn{from{transform:translate(-50%,20px);opacity:0}}

.pin-prompt{text-align:center;margin:24px 0 20px}.pin-prompt h2{font-size:1.15rem;margin:0 0 5px}.pin-prompt p{color:var(--muted);font-size:.8rem;margin:0}
.auth-pin .dots{gap:14px}.auth-pin .dots span{width:13px;height:13px;border-color:var(--muted);background:var(--sunk)}.auth-pin .dots span.f{background:var(--accent);border-color:var(--accent)}.auth-pin .dots.bad span{border-color:var(--gave)}
.auth-pin .pin-status{min-height:26px;margin:10px 0 8px;color:var(--gave);font-size:.8rem;line-height:1.6}.auth-pin .pad{gap:10px}.auth-pin .pad button{width:100%;max-width:none;height:60px;min-height:56px;aspect-ratio:auto;border:1px solid var(--line);border-radius:15px;background:var(--sunk);color:var(--ink);font-size:1.55rem;font-weight:500}.auth-pin .pad button:active{background:var(--cs-soft);border-color:var(--accent)}.auth-pin .pad .pin-delete{background:transparent;border-color:transparent;color:var(--muted);font-size:1.35rem}
.auth-forgot{align-self:center;margin-top:18px;min-height:36px;padding:4px 8px;background:none;border:0;color:var(--accent);font-size:.84rem;font-weight:600}
@media(max-width:370px){.auth-screen .in{gap:18px}.auth-panel{padding-inline:14px}.auth-intro h1{font-size:1.65rem}.pin-panel{padding:18px}.auth-pin .pad button{height:56px}.auth-pin .in{gap:12px}}

/* One touch language for every control, including controls replaced on render. */
:where(button,a.btn,summary,[role="button"],.pick>span){-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:where(button,a.btn,summary,[role="button"]):not(:disabled):not([aria-disabled="true"]){transition:scale 110ms ease-out,filter 110ms ease-out,box-shadow 140ms ease-out,background-color 140ms ease-out,border-color 140ms ease-out}
:where(button,a.btn,summary,[role="button"]):not(:disabled):not([aria-disabled="true"]):is(:active,.is-pressed){filter:brightness(.9);box-shadow:inset 0 0 0 999px rgba(8,80,65,.075)}
:where(button,a.btn,summary,[role="button"]):focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled,[aria-disabled="true"]{cursor:default}
.tap-echo{position:fixed;z-index:120;pointer-events:none;box-sizing:border-box;background:currentColor;opacity:0;animation:tapEcho 260ms ease-out both}
@keyframes tapEcho{0%{opacity:.14}100%{opacity:0}}
.nav button.on{background:var(--cs-soft);color:var(--accent);border-radius:14px}.att-tabs button.on,.seg button.on{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent),0 3px 9px rgba(8,80,65,.1)}
.field:focus-within>label,.att-field:focus-within>span:first-child{color:var(--accent)}
.settings-section[open]>summary{border-bottom:1px solid var(--line);margin-bottom:12px}
@media(prefers-reduced-motion:no-preference){
 :where(button,a.btn,summary,[role="button"]):not(:disabled):not([aria-disabled="true"]):is(:active,.is-pressed){scale:.97}
 .auth-screen .auth-user:is(:active,.is-pressed){scale:.985}
 .kp button:active,.pad button:active,.act:active,.btn:active,.dayrow:active,.att-btn:active:not(:disabled){transform:none}
 .nav button,.att-tabs button{transition:scale 110ms ease-out,background-color 150ms ease-out,color 150ms ease-out}
 .nav button.on svg{animation:navNudge 180ms ease-out}
 .band.enter .in>*{animation-duration:180ms}.wrap.enter>*{animation-duration:210ms;animation-delay:0ms!important}
 .login .in.enter>*,.login .in.enter .ubtn{animation-duration:200ms;animation-delay:0ms!important}
 .overlay .sheet{animation-duration:240ms}.overlay.out .sheet{animation-duration:180ms}
 .att-notice{animation:fadeUp 170ms ease-out}
 @keyframes navNudge{50%{transform:translateY(-2px)}}
}
@media(prefers-reduced-motion:reduce){.tap-echo{display:none}:where(button,a.btn,summary,[role="button"]){transition:none!important;scale:none!important}}
