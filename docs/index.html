<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اليومية</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="يومية المحلات: الكاشير بيسجل أخدت وأعطيت، وهشام بينقلها لكناش.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Calm, high-contrast ledger: white surfaces, one blue for navigation, green = أخدت, red = أعطيت (same as Konnash) */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --sunk:#f4f5f7; --ink:#15181d; --muted:#5f6672; --line:#e3e6ea;
  --accent:#1f4fd1; --accent-ink:#ffffff;
  --took:#0d7d43; --took-soft:#e6f4ec; --gave:#c9302a; --gave-soft:#fbe9e8;
  --scrim:rgba(10,14,20,.5); --font:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1114; --surface:#1a1d22; --sunk:#14171b; --ink:#eef0f3; --muted:#a2a9b4; --line:#2a2f36;
  --accent:#7ea2ff; --accent-ink:#0b1020;
  --took:#3fc480; --took-soft:#12291d; --gave:#ff7a70; --gave-soft:#321816;
  --scrim:rgba(0,0,0,.65); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.35;font-weight:700}
h1{font-size:1.4rem} h2{font-size:1.05rem} h3{font-size:.95rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:.88rem}
p{margin:0}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.top .me{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.top .me small{color:var(--muted);font-weight:400}
.offline{background:var(--gave-soft);color:var(--ink);text-align:center;font-size:.9rem;padding:6px 16px}

.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap.admin{padding-bottom:110px}
section{display:flex;flex-direction:column;gap:10px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--gave);border-color:var(--gave);color:#fff}
.btn.took{background:var(--took);border-color:var(--took);color:#fff}
.btn.gave{background:var(--gave);border-color:var(--gave);color:#fff}
.btn.wide{width:100%;min-height:54px;font-size:1.05rem}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 6px;min-height:0}
.btn:disabled{opacity:.45;cursor:not-allowed}

.seg{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;min-width:0;border:0;background:transparent;border-radius:9px;padding:9px 8px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{border:0;border-radius:18px;min-height:120px;color:#fff;font-size:1.6rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bigbtn small{font-size:.9rem;font-weight:500;opacity:.9}
.bigbtn.took{background:var(--took)} .bigbtn.gave{background:var(--gave)}
.bigbtn:disabled{opacity:.4;cursor:not-allowed}

.totals{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.totals div{padding:12px 14px;min-width:0}
.totals div+div{border-inline-start:1px solid var(--line)}
.totals small{display:block;color:var(--muted);font-size:.85rem}
.totals b{font-size:1.25rem}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item.tap{cursor:pointer} .item.tap:hover{background:var(--sunk)}
.item .who{font-weight:600;overflow-wrap:anywhere}
.item .sub{grid-column:1;font-size:.86rem;color:var(--muted);overflow-wrap:anywhere}
.item .amt{grid-row:1;grid-column:2;font-weight:700;font-size:1.1rem;text-align:left}
.item .side{grid-column:2;display:flex;justify-content:flex-end}
.item.del .who,.item.del .amt{text-decoration:line-through;opacity:.55}
.item .flag{font-size:.82rem;color:var(--gave)}
.took-t{color:var(--took)} .gave-t{color:var(--gave)}
.chip{display:inline-block;font-size:.8rem;font-weight:700;border-radius:6px;padding:0 7px;margin-inline-end:6px;vertical-align:1px}
.chip.took{background:var(--took-soft);color:var(--took)} .chip.gave{background:var(--gave-soft);color:var(--gave)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px;text-align:center;color:var(--muted)}
.dayhead{font-size:.88rem;color:var(--muted);font-weight:600}
.banner{border-radius:14px;padding:12px 14px;font-size:.95rem;background:var(--surface);border:1px solid var(--line)}
.banner.warn{background:var(--gave-soft);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.92rem;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px 14px;min-width:0;min-height:48px}
input.amount{font-size:2rem;font-weight:700;text-align:center;direction:ltr}
input[type=password]{direction:ltr;text-align:center;letter-spacing:.4em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;max-height:210px;overflow:auto;background:var(--sunk)}
.names p{padding:10px 14px}
.opt{position:relative;display:block;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;font-weight:500}
.opt:first-child{border-top:0}
.opt input{position:absolute;opacity:0;pointer-events:none;width:1px;min-height:0}
.opt:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:700}
.opt.new{color:var(--accent);font-weight:700}
.opt.new:has(input:checked){color:var(--accent-ink)}
.err{color:var(--gave);font-size:.92rem;min-height:1.3em}

.overlay{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:16px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.sheet form{display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:20px}}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead h2{font-size:1.25rem}
.shead.took h2{color:var(--took)} .shead.gave h2{color:var(--gave)}
.x{border:0;background:var(--sunk);width:40px;height:40px;border-radius:50%;font-size:1.3rem;line-height:1;flex-shrink:0}

.kstep{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:8px 0}
.kstep .name{font-size:1.5rem;font-weight:700;overflow-wrap:anywhere}
.kstep .press{font-size:1rem}
.kstep .press b{display:inline-block;color:#fff;border-radius:8px;padding:2px 14px;margin:0 4px}
.kstep .press b.took{background:var(--took)} .kstep .press b.gave{background:var(--gave)}
.kstep .bignum{font-size:3.2rem;font-weight:700;line-height:1.1}
.kstep .note{color:var(--muted)}

.nav{position:fixed;inset:auto 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:10px 2px;font-size:.85rem;font-weight:600;color:var(--muted);position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--accent)}
.badge{position:absolute;top:5px;inset-inline-start:calc(50% + 8px);background:var(--gave);color:#fff;border-radius:999px;font-size:.72rem;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-variant-numeric:tabular-nums}

.login{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:36px max(16px,env(safe-area-inset-right,0px)) 36px max(16px,env(safe-area-inset-left,0px))}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ubtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 14px;font-size:1.15rem;font-weight:700;min-width:0;overflow-wrap:anywhere}
.dots{display:flex;gap:14px;justify-content:center;direction:ltr}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots span.f{background:var(--ink);border-color:var(--ink)}
.dots.bad span{border-color:var(--gave)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.pad button{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:64px;font-size:1.6rem;font-weight:600}
.pad button:active{background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;z-index:40;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<noscript>البرنامج محتاج JavaScript يشتغل.</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
