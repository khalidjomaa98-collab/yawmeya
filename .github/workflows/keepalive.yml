# Supabase pauses free projects after a week without activity.
# This touches the database every two days so the app never goes to sleep.
name: Keep database awake

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "https://srpgxvdbpkinrvklwywx.supabase.co/rest/v1/rpc/login_users" \
            -H "apikey: sb_publishable_dY5nOPcQk00O5YNrWdGxWg__9GacVjo" \
            -H "Content-Type: application/json" -d '{}')
          echo "status $code"
          test "$code" = "200"
